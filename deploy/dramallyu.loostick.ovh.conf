# Vhost Apache pour Dramallyu.
#
# PORT 80 UNIQUEMENT, et ce n'est pas un detail : le *:443 par defaut appartient a
# projet-instit, qui capture tout. Un vhost pose sur 443 renverrait la page de
# connexion « Espace Enseignants » au lieu de l'addon.
#
# Chemin public : navigateur -> Cloudflare -> tunnel cloudflared (catch-all)
#                 -> Apache :80 (route par ServerName) -> conteneur 127.0.0.1:7020
#
# Installation :
#   sudo cp deploy/dramallyu.loostick.ovh.conf /etc/apache2/sites-available/
#   sudo a2ensite dramallyu.loostick.ovh.conf
#   sudo apache2ctl configtest && sudo systemctl reload apache2

<VirtualHost *:80>
    ServerName dramallyu.loostick.ovh

    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:7020/
    ProxyPassReverse / http://127.0.0.1:7020/

    # Sans CORS, l'application Stremio refuse le manifeste : elle appelle l'addon
    # depuis une origine web.
    Header set Access-Control-Allow-Origin "*"
    Header set Access-Control-Allow-Methods "GET, POST, OPTIONS"
    Header set Access-Control-Allow-Headers "Content-Type"

    ErrorLog ${APACHE_LOG_DIR}/dramallyu_error.log
    CustomLog ${APACHE_LOG_DIR}/dramallyu_access.log combined
</VirtualHost>
