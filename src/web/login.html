<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dramallyu — administration</title>
<style>
  body { margin:0; min-height:100vh; display:grid; place-items:center;
         background:#12131a; color:#e8e9ee;
         font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  form { background:#1b1d27; border:1px solid #2e3140; border-radius:10px;
         padding:2rem; width:min(360px,90vw); }
  h1 { font-size:1.2rem; margin:0 0 1.2rem; }
  label { display:block; font-size:.88rem; margin-bottom:.4rem; color:#9aa0b4; }
  input { width:100%; padding:.65rem .7rem; background:#0e0f15; color:#e8e9ee;
          border:1px solid #2e3140; border-radius:6px; font:inherit; }
  input:focus { outline:2px solid #c9a227; outline-offset:1px; }
  button { width:100%; margin-top:1.1rem; background:#c9a227; color:#12131a;
           border:0; border-radius:6px; padding:.7rem; font:inherit; font-weight:650; cursor:pointer; }
</style>
</head>
<body>
  <form method="post" action="/admin/login">
    <h1>Administration Dramallyu</h1>
    <label for="password">Mot de passe operateur</label>
    <input type="password" id="password" name="password" autocomplete="current-password" autofocus required>
    <button type="submit">Entrer</button>
  </form>
</body>
</html>
